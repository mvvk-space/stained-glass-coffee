<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mosaic Brew | Artisanal Coffee</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Quicksand:wght@300;500&display=swap');

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #0c0805;
        }

        #canvas-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        .overlay {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fdf5e6;
            pointer-events: none;
        }

        .hero-card {
            background: rgba(12, 8, 5, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 4rem;
            border: 1px solid rgba(255, 215, 0, 0.2);
            text-align: center;
            pointer-events: auto;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 4rem;
            margin: 0;
            letter-spacing: 8px;
            color: #d4af37; /* Gold */
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }

        p {
            font-family: 'Quicksand', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin: 20px 0 30px 0;
            opacity: 0.8;
        }

        .cta {
            padding: 12px 35px;
            border: 1px solid #d4af37;
            background: transparent;
            color: #d4af37;
            font-family: 'Quicksand', sans-serif;
            font-weight: 500;
            text-decoration: none;
            transition: 0.4s;
            cursor: pointer;
        }

        .cta:hover {
            background: #d4af37;
            color: #0c0805;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.5);
        }

        nav {
            position: absolute;
            top: 40px; left: 50px; right: 50px;
            display: flex;
            justify-content: space-between;
            z-index: 10;
            pointer-events: auto;
        }

        .logo {
            font-family: 'Cinzel', serif;
            color: #d4af37;
            font-weight: 700;
            text-decoration: none;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="logo">MOSAIC BREW</a>
    </nav>

    <div id="canvas-container"></div>

    <div class="overlay">
        <div class="hero-card">
            <h1>STAINED GLASS<br>ESPRESSO</h1>
            <p>Complexity in every pour.</p>
            <a href="#" class="cta">EXPLORE THE ROASTS</a>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const fragmentShader = `
            uniform float u_time;
            uniform vec2 u_resolution;
            uniform vec2 u_mouse;

            #define PI 3.14159265

            // --- FLOPINE'S VORONOI LOGIC ---
            vec2 rand (vec2 x) {
                return fract(sin(vec2(dot(x, vec2(1.2,5.5)), dot(x, vec2(4.54,2.41))))*4.45);
            }

            vec3 voro (vec2 uv) {
                vec2 uv_id = floor (uv);
                vec2 uv_st = fract(uv);
                vec2 m_diff, m_point, m_neighbor;
                float m_dist = 10.;

                for (int j = -1; j<=1; j++) {
                    for (int i = -1; i<=1; i++) {
                        vec2 neighbor = vec2(float(i), float(j));
                        vec2 point = rand(uv_id + neighbor);
                        point = 0.5+0.5*sin(2.*PI*point + u_time * 0.5); // Slower time for elegance
                        vec2 diff = neighbor + point - uv_st;
                        float dist = length(diff);
                        if (dist < m_dist) {
                            m_dist = dist; m_point = point; m_diff = diff; m_neighbor = neighbor;
                        }
                    }
                }

                m_dist = 10.;
                for (int j = -2; j<=2; j++) {
                    for (int i = -2; i<=2; i++) {
                        if (i==0 && j==0) continue;
                        vec2 neighbor = m_neighbor + vec2(float(i), float(j));
                        vec2 point = rand(uv_id + neighbor);
                        point = 0.5+0.5*sin(point*2.*PI + u_time * 0.5);
                        vec2 diff = neighbor + point - uv_st;
                        float dist = dot(0.5*(m_diff+diff), normalize(diff-m_diff));
                        m_dist = min(m_dist, dist);
                    }
                }
                return vec3(m_point, m_dist);
            }

            // --- WARP LOGIC (COMBINED) ---
            vec2 Warp(vec2 p) {
                p = (p + 3.)*2.0;
                float t = u_time * 0.2;
                for (int i=0; i<3; i++) {
                    p += cos(p.yx*2.0 + vec2(t, 1.57))/2.0;
                    p += sin(p.yx + t + vec2(1.57, 0))/2.0;
                    p *= 1.1;
                }
                return p;
            }

            void main() {
                vec2 uv = (gl_FragCoord.xy - u_resolution.xy*.5)/u_resolution.y;
                
                // Interaction: Mouse pushes the liquid
                vec2 mouse = (u_mouse / u_resolution) - 0.5;
                float mouseDist = length(uv - mouse);
                uv -= (mouse * 0.1) / (mouseDist + 0.5);

                // Apply the Warp to the Voronoi UVs
                vec2 warpedUV = Warp(uv);
                vec3 v = voro(warpedUV * 4.0); // Voronoi Detail

                // Lighting & Bump (from the first shader)
                float border = smoothstep(0.02, 0.06, v.z);
                
                // Color Palette: Deep Coffee to Golden Crema
                vec3 darkCoffee = vec3(0.12, 0.07, 0.04);
                vec3 mediumRoast = vec3(0.35, 0.18, 0.08);
                vec3 goldCrema = vec3(0.85, 0.65, 0.3);
                
                // Use Voronoi cell data to mix colors
                vec3 cellColor = mix(darkCoffee, goldCrema, v.x);
                cellColor = mix(cellColor, mediumRoast, v.y);
                
                // Apply the "Grout" (border) of the mosaic
                vec3 col = cellColor * border;
                
                // Add a "Liquid Gloss" finish
                float spec = pow(v.z, 10.0) * 0.5;
                col += spec * vec3(1.0, 0.9, 0.7);

                // Vignette for depth
                col *= 1.2 - length(uv);

                gl_FragColor = vec4(sqrt(max(col, 0.0)), 1.0);
            }
        `;

        const vertexShader = `void main() { gl_Position = vec4(position, 1.0); }`;

        // Scene Setup
        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const material = new THREE.ShaderMaterial({
            vertexShader, fragmentShader,
            uniforms: {
                u_time: { value: 0 },
                u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                u_mouse: { value: new THREE.Vector2(0, 0) }
            }
        });

        const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
        scene.add(mesh);

        function animate(t) {
            material.uniforms.u_time.value = t / 1000;
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate(0);

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            material.uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
        });

        document.addEventListener('mousemove', (e) => {
            material.uniforms.u_mouse.value.set(e.clientX, window.innerHeight - e.clientY);
        });
    </script>
</body>
</html>
